[project]
name = "thesis-api"
version = "0.1.0"
description = "Thesis FastAPI backend"
requires-python = ">=3.12"
dependencies = [
  "thesis-contracts",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "httpx>=0.28",
  "pydantic-settings>=2.6",
  "python-multipart>=0.0.17",
  "boto3>=1.35",
  "argon2-cffi>=23.1",
  "email-validator>=2.2",
  "temporalio>=1.7",
]

[project.optional-dependencies]
sandbox = [
    "opensandbox==1.2.0",
]

[tool.uv.sources]
thesis-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/thesis_api"]

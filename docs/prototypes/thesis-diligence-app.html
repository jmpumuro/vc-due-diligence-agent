  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>

er-strong:#D2D6DE;--hair:rgba(11,13,18,.06);\n  --text:#0B0D12;--muted:#5B6271;\n  --ink:#0B0D12;--ink-text:#FFFFFF;--ink-hover:#262A33;\n  --brand:#2E5BFF;--brand-hover:#1F48EA;--brand-soft:#E9EFFF;--brand-text:#1D44DA;\n  --green:#0D7D55;--amber:#A65905;--red:#C42D26;--blue:#0A72A0;--gray:#848B98;\n  --overlay:rgba(11,13,18,.42);--shadow:0 20px 48px -16px rgba(11,13,18,.32),0 2px 6px rgba(11,13,18,.06);\n  --ring:0 0 0 3px rgba(46,91,255,.28)}\n.t-dark{\n  --shell:#040507;--bg:#0D0F13;--surface:#15181E;--surface-2:#1B1F26;--surface-3:#252A33;\n  --border:#232831;--border-strong:#333A45;--hair:rgba(255,255,255,.06);\n  --text:#ECEEF2;--muted:#9CA3B0;\n  --ink:#ECEEF2;--ink-text:#0B0D12;--ink-hover:#FFFFFF;\n  --brand:#7D9BFF;--brand-hover:#9BB2FF;--brand-soft:#18244A;--brand-text:#B4C6FF;\n  --green:#35C281;--amber:#E7A440;--red:#F3655D;--blue:#4CC0E8;--gray:#737B89;\n  --overlay:rgba(0,0,0,.62);--shadow:0 22px 50px -14px rgba(0,0,0,.75),0 2px 8px rgba(0,0,0,.45);\n  --ring:0 0 0 3px rgba(125,155,255,.35)}\n\n/* ---------- Base ---------- */\nbody{margin:0;font-family:Inter,system-ui,sans-serif;font-size:14px;line-height:1.5;font-feature-settings:'tnum' 1,'cv11' 1;-webkit-font-smoothing:antialiased;background:#0B0D12}\na{color:inherit}\nbutton,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}\nh1{margin:0;font-family:'Bricolage Grotesque',Inter,sans-serif;font-size:34px;font-weight:600;letter-spacing:-0.035em;line-height:1.1}\nh2{margin:0;font-family:'Bricolage Grotesque',Inter,sans-serif;font-size:17px;font-weight:600;letter-spacing:-0.015em}\n.disp{font-family:'Bricolage Grotesque',Inter,sans-serif;font-weight:600;letter-spacing:-0.025em;line-height:1.15}\n.mute{color:var(--muted)}\n.lbl{font-size:12px;color:var(--muted)}\n.mono{font-family:'Geist Mono',ui-monospace,monospace;font-size:12px}\n.sub{margin:8px 0 0;color:var(--muted);font-size:15px;max-width:720px}\n.scroll{overflow-x:auto}\n\n/* ---------- Shell ---------- */\n.app{background:var(--shell);color:var(--text);min-height:100vh;display:flex;align-items:stretch;position:relative}\n.panel{background:var(--bg);margin:8px 8px 8px 0;border-radius:22px;min-height:calc(100vh - 16px);box-shadow:0 0 0 1px rgba(255,255,255,.04)}\n.page{padding:20px 40px 64px;display:flex;flex-direction:column;gap:28px;max-width:1280px;width:100%;margin:0 auto;box-sizing:border-box}\n.ph{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:flex-end}\n.wiz{max-width:760px;width:100%;align-self:center;display:flex;flex-direction:column;gap:20px}\n\n/* ---------- Sidebar (collapsed rail, expands on hover/focus, can be pinned) ---------- */\n.rail{flex:none;width:68px;position:relative;z-index:30;transition:width .22s cubic-bezier(.2,.8,.2,1)}\n.app.pinned .rail{width:252px}\n.side{--text:#EEF0F4;--muted:#8A92A2;--surface:#151820;--surface-2:rgba(255,255,255,.06);--surface-3:rgba(255,255,255,.1);--border:rgba(255,255,255,.07);--brand-soft:rgba(255,255,255,.09);--brand-text:#FFFFFF;\n  position:sticky;top:0;height:100vh;width:68px;background:var(--shell);color:var(--text);display:flex;flex-direction:column;gap:4px;padding:12px 10px;box-sizing:border-box;overflow:hidden;transition:width .22s cubic-bezier(.2,.8,.2,1),box-shadow .22s ease-out}\n.side:hover,.side:focus-within,.app.pinned .side{width:252px}\n.side:hover,.side:focus-within{box-shadow:12px 0 40px -12px rgba(0,0,0,.6)}\n.app.pinned .side{box-shadow:none}\n.nl{opacity:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;transition:opacity .12s ease-out}\n.side:hover .nl,.side:focus-within .nl,.app.pinned .nl{opacity:1;transition:opacity .18s ease-out .06s}\n.brandrow{display:flex;align-items:center;gap:12px;height:44px;padding:0 6px;margin-bottom:8px}\n.navi{display:flex;align-items:center;gap:12px;width:100%;height:40px;padding:0 14px;border:0;border-radius:12px;background:transparent;color:var(--muted);cursor:pointer;text-align:left;font-weight:500;text-decoration:none;box-sizing:border-box;flex:none;transition:background .15s ease-out,color .15s ease-out}\n.navi:hover{background:var(--surface-2);color:var(--text)}\n.navi.on{background:var(--brand-soft);color:var(--brand-text);font-weight:600}\n.navi .ic{position:relative;display:flex;flex:none}\n.navi.on .ic{color:#9DB4FF}\n.bdot{position:absolute;top:-3px;right:-4px;width:8px;height:8px;border-radius:99px;background:#F3655D;border:2px solid var(--shell);transition:opacity .12s}\n.side:hover .bdot,.side:focus-within .bdot,.app.pinned .bdot{opacity:0}\n.sect{display:flex;align-items:center;height:28px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:0 14px;margin-top:10px;flex:none}\n.sect::before{content:'';display:block;width:20px;height:1px;background:var(--border);margin-right:-20px;transition:opacity .12s}\n.side:hover .sect::before,.side:focus-within .sect::before,.app.pinned .sect::before{opacity:0}\n.sidefoot{margin-top:auto;display:flex;flex-direction:column;gap:4px;padding-top:10px;border-top:1px solid var(--border)}\n.avatar{width:30px;height:30px;border-radius:99px;background:var(--brand-soft);color:var(--brand-text);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:12px;flex:none}\n\n/* ---------- Top bar ---------- */\n.top{position:sticky;top:0;z-index:10;display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:14px 32px;min-height:68px;box-sizing:border-box;border-radius:22px 22px 0 0;background:color-mix(in srgb,var(--bg) 82%,transparent);-webkit-backdrop-filter:saturate(1.5) blur(14px);backdrop-filter:saturate(1.5) blur(14px)}\n.crumbs{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);flex:1 1 220px;min-width:0}\n.crumbs b{color:var(--text);font-weight:500}\n.crumbs button{border:0;background:none;padding:0;color:inherit;cursor:pointer;font:inherit}\n.crumbs button:hover{color:var(--text)}\n.search{display:flex;align-items:center;gap:8px;height:4 -visible,.navi:focus-visible,.tr:focus-visible,.choice:focus-visible,.iconbtn:focus-visible,.search:focus-visible,.kpi:focus-visible,.toc:focus-visible,.pitem:focus-visible,.step:focus-visible{outline:none;box-shadow:var(--ring)}\n\n/* ---------- Surfaces ---------- */\n.card{background:var(--surface);border:0;border-radius:22px;box-shadow:0 0 0 1px var(--hair),0 1px 3px rgba(11,13,18,.05)}\n.t-dark .card{box-shadow:0 0 0 1px var(--hair)}\n.inkcard{background:var(--shell);color:#EEF0F4;--text:#EEF0F4;--muted:#A1A8B5;--surface:#151820;--surface-2:rgba(255,255,255,.07);--border:rgba(255,255,255,.1);--brand:#8FA8FF;--brand-soft:rgba(143,168,255,.18);--brand-text:#CFDAFF;box-shadow:0 18px 40px -18px rgba(11,13,18,.55)}\n.t-dark .inkcard{background:#1A1E27;box-shadow:0 0 0 1px var(--hair)}\n.inkcard .pill{color:#EEF0F4}\n.ch{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;padding:18px 24px;min-height:60px;border-bottom:1px solid var(--border);box-sizing:border-box}\n.cb{padding:20px 24px}\n.cf{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:14px 24px;border-top:1px solid var(--border);background:var(--surface-2);border-radius:0 0 22px 22px}\n.callout{padding:16px 18px;border-radius:16px;background:var(--surface-2);font-size:14px}\n.quote{font-size:14px;padding:12px 16px;border-radius:12px;background:var(--surface-2)}\n.disc{font-size:12px;color:var(--muted);padding:10px 14px;border:1px solid var(--border);background:var(--surface-2);border-radius:12px}\n.restricted{display:flex;gap:12px;align-items:center;padding:14px 16px;border:1px dashed var(--border-strong);border-radius:16px;color:var(--muted);font-size:13px}\n\n/* ---------- Status ---------- */\n.dot{display:inline-block;width:8px;height:8px;border-radius:99px;flex:none}\n.pill{display:inline-flex;align-items:center;gap:7px;padding:3px 11px 3px 9px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap;border:1px solid color-mix(in srgb,var(--c,va 002Fsc-if>\n<\u002Fdiv>\n<\u002Fsection>\n<\u002Fsc-if>\n<section class=\"card\">\n<div class=\"ch\"><h2>Calculated metrics<\u002Fh2><span class=\"lbl\">Calculated by fixed formulas (ddcalc@1) from cited source cells; never estimated<\u002Fspan><\u002Fdiv>\n<div class=\"scroll\"><div style=\"min-width: 900px\">\n<div class=\"thd\" style=\"grid-template-columns: 1.3fr 1fr 1.2fr 1.6fr 2.2fr\"><span>Metric<\u002Fspan><span>Value<\u002Fspan><span>Period<\u002Fspan><span>Formula and inputs<\u002Fspan><span>Status<\u002Fspan><\u002Fdiv>\n<sc-for list=\"{{fin.metrics}}\" as=\"m\" hint-placeholder-count=\"12\">\n<div class=\"tr\" style=\"grid-template-columns: 1.3fr 1fr 1.2fr 1.6fr 2.2fr; cursor: default\">\n<span style=\"font-weight: 600\">{{m.name}}<\u002Fspan>\n<span style=\"font-weight: 600; color: {{m.valColor}}\">{{m.value}}<\u002Fspan>\n<span class=\"mute\">{{m.period}}<\u002Fspan>\n<span style=\"display: flex; flex-direction: column\"><span class=\"mono\">{{m.formula}}<\u002Fspan><span class=\"lbl\"><a href=\"#\">{{m.inputs}}<\u002Fa><\u002Fspan><\u002Fspan>\n<span style=\"display: flex; gap: 8px; align-items: flex-start\"><span class=\"dot\" style=\"background: {{m.dot}}; margin-top: 7px\"><\u002Fspan><span>{{m.status}}<\u002Fspan><\u002Fspan>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv><\u002Fdiv>\n<div class=\"disc\" style=\"margin: 12px 18px\">These figures are calculated from documents the company provided. This is not an audit or an accounting opinion.<\u002Fdiv>\n<\u002Fsection>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fsc-if>\n\n<!-- RISKS -->\n<sc-if value=\"{{tab.risks}}\" hint-placeholder-val=\"{{false}}\">\n<div style=\"display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start\">\n<section class=\"card\" style=\"flex: 1 1 260px; min-width: 0\">\n<div class=\"ch\"><h2>Severity × likelihood<\u002Fh2><\u002Fdiv>\n<div class=\"cb\"><div class=\"mx\">\n<sc-for list=\"{{riskMatrix}}\" as=\"c\" hint-placeholder-count=\"20\"><span style=\"{{c.style}}\">{{c.v}}<\u002Fspan><\u002Fsc-for>\n<\u002Fdiv><p class=\"lbl\" style=\"margin: 10px 0 0\">Counts of open risks you can see.<\u002Fp><\u002Fdiv>\n<\u002Fsection>\n<section class=\"card\" style=\"flex: 999 1 560px; min-width: 0\">\n<div class=\"ch\"><h2>Risk register<\u002Fh2><span class=\"lbl\">Every risk links to the findings behind it<\u002Fspan><\u002Fdiv>\n<sc-for list=\"{{risks}}\" as=\"r\" hint-placeholder-count=\"5\">\n<div class=\"li\" style=\"display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center\">\n<span class=\"pill\" style=\"--c: {{r.dot}}; min-width: 74px\"><span class=\"dot\" style=\"background: {{r.dot}}\"><\u002Fspan>{{r.sev}}<\u002Fspan>\n<span style=\"flex: 1 1 320px; display: flex; flex-direction: column; gap: 2px\"><span style=\"font-weight: 500\">{{r.title}}<\u002Fspan><span class=\"lbl\">{{r.meta}}<\u002Fspan><span class=\"lbl\">Ask: {{r.ask}}<\u002Fspan><\u002Fspan>\n<span class=\"chip\">{{r.status}}<\u002Fspan>\n<button class=\"btn btn-sm\" sc-camel-on-click=\"{{r.cycle}}\">{{r.next}}<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fsection>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- CONTRADICTIONS -->\n<sc-if value=\"{{tab.contra}}\" hint-placeholder-val=\"{{false}}\">\n<div style=\"display: flex; flex-direction: column; gap: 16px\">\n<sc-for list=\"{{contras}}\" as=\"x\" hint-placeholder-count=\"3\">\n<section class=\"card\">\n<div class=\"ch\"><h2>{{x.title}}<\u002Fh2><span class=\"lbl\">{{x.meta}}<\u002Fspan><\u002Fdiv>\n<sc-if value=\"{{x.isRestricted}}\" hint-placeholder-val=\"{{false}}\"><div class=\"cb\"><div class=\"restricted\">Restricted to the deal team.<\u002Fdiv><\u002Fdiv><\u002Fsc-if>\n<sc-if value=\"{{x.isOpen}}\" hint-placeholder-val=\"{{true}}\">\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr))\">\n<sc-for list=\"{{x.sides}}\" as=\"s\" hint-placeholder-count=\"2\">\n<div class=\"cb\" style=\"display: flex; flex-direction: column; gap: 6px; border-right: 1px solid var(--border)\">\n<span tion class=\"card\">\n<div class=\"ch\"><h2>{{evHeader}}<\u002Fh2><sc-if value=\"{{evFiltered}}\" hint-placeholder-val=\"{{false}}\"><button class=\"btn btn-sm\" sc-camel-on-click=\"{{clearFilter}}\">Show all findings<\u002Fbutton><\u002Fsc-if><sc-if value=\"{{evUnfiltered}}\" hint-placeholder-val=\"{{true}}\"><span class=\"lbl\">Every finding links to a saved web page or a document page<\u002Fspan><\u002Fsc-if><\u002Fdiv>\n<sc-if value=\"{{evEmpty}}\" hint-placeholder-val=\"{{false}}\"><div class=\"li lbl\">No findings of this kind you can see.<\u002Fdiv><\u002Fsc-if>\n<sc-for list=\"{{claims}}\" as=\"c\" hint-placeholder-count=\"8\">\n<article class=\"li\" style=\"display: flex; flex-direction: column; gap: 8px\">\n<div style=\"display: flex; gap: 10px; align-items: center; flex-wrap: wrap\"><span class=\"pill\" style=\"--c: {{c.dot}}\"><span class=\"dot\" style=\"background: {{c.dot}}\"><\u002Fspan>{{c.label}}<\u002Fspan><span class=\"lbl\">{{c.topic}}<\u002Fspan><sc-if value=\"{{c.isPrivate}}\" hint-placeholder-val=\"{{false}}\"><span class=\"chip\">Private · deal team<\u002Fspan><\u002Fsc-if><\u002Fdiv>\n<span style=\"font-size: 15px; font-weight: 500\">{{c.statement}}<\u002Fspan>\n<sc-if value=\"{{c.hasQuote}}\" hint-placeholder-val=\"{{true}}\">\n<span class=\"quote\">“{{c.quote}}”<\u002Fspan>\n<span class=\"lbl\"><a href=\"#\">{{c.source}}<\u002Fa> · {{c.saved}}<\u002Fspan>\n<\u002Fsc-if>\n<sc-if value=\"{{c.hasExplain}}\" hint-placeholder-val=\"{{false}}\"><span class=\"lbl\">{{c.explain}}<\u002Fspan><\u002Fsc-if>\n<\u002Farticle>\n<\u002Fsc-for>\n<\u002Fsection>\n<\u002Fsc-if>\n\n<!-- HISTORY -->\n<sc-if value=\"{{tab.history}}\" hint-placeholder-val=\"{{false}}\">\n<section class=\"card\">\n<div class=\"ch\"><h2>Revisions<\u002Fh2><span class=\"lbl\">New evidence or an upgrade creates a new revision; approved reports never change<\u002Fspan><\u002Fdiv>\n<sc-for list=\"{{history}}\" as=\"h\" hint-placeholder-count=\"3\">\n<div class=\"li\" style=\"display: ass=\"lbl\">Attractiveness<\u002Fdiv><div style=\"font-weight: 600\">{{r.score}}<\u002Fdiv><\u002Fdiv><div><div class=\"lbl\">Open risks<\u002Fdiv><div style=\"font-weight: 600\">{{r.risks}}<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<sc-if value=\"{{r.hasProblem}}\" hint-placeholder-val=\"{{false}}\">\n<div class=\"callout\" style=\"border-left: 3px solid {{r.problemColor}}; display: flex; flex-direction: column; gap: 8px\">\n<strong style=\"font-weight: 600\">{{r.problemTitle}}<\u002Fstrong><span class=\"mute\">{{r.problemText}}<\u002Fspan>\n<sc-if value=\"{{r.canReload}}\" hint-placeholder-val=\"{{false}}\"><div><button class=\"btn\" sc-camel-on-click=\"{{r.reload}}\">Review the new version<\u002Fbutton><\u002Fdiv><\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{r.reqOpen}}\" hint-placeholder-val=\"{{false}}\">\n<div class=\"callout\" style=\"display: flex; flex-direction: column; gap: 8px\">\n<strong style=\"font-weight: 600\">What do you need from the company?<\u002Fstrong>\n<label class=\"lbl\" style=\"display: flex; flex-direction: column; gap: 6px; font-weight: 500\">One item per line (required)<textarea class=\"input\" style=\"min-height: 64px; padding: 10px; resize: vertical\">Signed IP assignment from the CTO covering pre-incorporation work\nWhich ARR definition the deck uses, with the calculation<\u002Ftextarea><\u002Flabel>\n<div><button class=\"btn btn-primary\" sc-camel-on-click=\"{{r.sendRequest}}\">Send request<\u002Fbutton><\u002Fdiv>\n<span class=\"lbl\">Sends decision request_information. The assessment moves to “Waiting for information”; each line becomes a draft request on the Requests tab.<\u002Fspan>\n<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{r.isDone}}\" hint-placeholder-val=\"{{false}}\"><span class=\"pill\" style=\"--c: {{r.doneDot}}; align-self: flex-start\"><span class=\"dot\" style=\"background: {{r.doneDot}}\"><\u002Fspan>{{r.doneLabel}}<\u002Fspan><\u002Fsc-if>\n<\u002Fdiv>\n<sc-if value=\"{{r.isPending}}\" hint-placeholder-val=\"{{true}}\">\n<div class=\"cf\">\n<button class=\"btn btn-primary\" sc-camel-on-click=\"{{r.approve}}\">Advance<\u002Fbutton>\n<button class=\"btn\" sc-camel-on-click=\"{{r.research}}\">Request more information…<\u002Fbutton>\n<button class=\"btn\" sc-camel-on-click=\"{{r.reject}}\">Pass<\u002Fbutton>\n<div style=\"flex: 1\"><\u002Fdiv>\n<button class=\"btn btn-ghost\" sc-camel-on-click=\"{{r.open}}\">Read report<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Farticle>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- WATCHLIST -->\n<sc-if value=\"{{is.watchlist}}\" hint-placeholder-val=\"{{false}}\">\n<div style=\"display: flex; flex-direction: column; gap: 24px\">\n<div class=\"ph\"><div><h1>Watchlist<\u002Fh1><p class=\"sub\">We keep an eye on these companies and tell you when something important changes.<\u002Fp><\u002Fdiv><button class=\"btn\">Add company<\u002Fbutton><\u002Fdiv>\n<section class=\"card\">\n<div class=\"scroll\"><div style=\"min-width: 720px\">\n<div class=\"thd\" style=\"grid-template-columns: 34px 1.2fr 2fr 1.6fr 0.6fr\"><span><\u002Fspan><span>Company<\u002Fspan><span>Watching for<\u002Fspan><span>Latest<\u002Fspan><span><\u002Fspan><\u002Fdiv>\n<sc-for list=\"{{watch}}\" as=\"w\" hint-placeholder-count=\"4\">\n<div class=\"tr\" style=\"grid-template-columns: 34px 1.2fr 2fr 1.6fr 0.6fr; cursor: default\">\n<span class=\"logo\">{{w.initials}}<\u002Fspan>\n<span style=\"font-weight: 600\">{{w.company}}<\u002Fspan>\n<span style=\"display: flex; flex-direction: column\"><span>{{w.rules}}<\u002Fspan><span class=\"lbl\">{{w.cadence}}<\u002Fspan><\u002Fspan>\n<span>{{w.latest}}<\u002Fspan>\n<span><button class=\"btn btn-sm\" sc-camel-on-click=\"{{w.toggle}}\">{{w.toggleLabel}}<\u002Fbutton><\u002Fspan>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv><\u002Fdiv>\n<\u002Fsection>\n<section class=\"card\">\n<div class=\"ch\"><h2>Recent changes<\u002Fh2><\u002Fdiv>\n<sc-for list=\"{{events}}\" as=\"e\" hint-placeholder-count=\"5\">\n<div class=\"li\" style=\"display: flex; gap: 14px\">\n<span class=\"dot\" style=\"background: {{e.dot}}; margin-top: 7px\"><\u002Fspan>\n<span style=\"flex: 1; display: flex; flex-direction: column; gap: 2px\"><span style=\"font-weight: 600\">{{e.company}} <span class=\"lbl\" style=\"font-weight: 400\">· {{e.importance}} · {{e.when}}<\u002Fspan><\u002Fspan><span>{{e.summary}}<\u002Fspan><span class=\"lbl\">{{e.next}}<\u002Fspan><\u002Fspan>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fsection>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- THESIS -->\n<sc-if value=\"{{is.thesis}}\" hint-placeholder-val=\"{{false}}\">\n<div style=\"display: flex; flex-direction: column; gap: 24px; max-width: 900px\">\n<div class=\"ph\"><div><h1>Investment thesis<\u002Fh1><p class=\"sub\">What the agents look for. Changes apply to new research; reviews already running keep their version.<\u002Fp><\u002Fdiv><button class=\"btn btn-primary\">Save changes<\u002Fbutton><\u002Fdiv>\n<section class=\"card\">\n<div class=\"ch\"><h2>Mandate<\u002Fh2><\u002Fdiv>\n<div class=\"cb\" style=\"display: flex; flex-direction: column; gap: 18px\">\n<label for=\"th\" class=\"lbl\" style=\"display: flex; flex-direction: column; gap: 6px; font-weight: 500\">Thesis\n<textarea id=\"th\" class=\"input\" style=\"min-height: 84px; padding: 12px; resize: vertical; font-size: 15px; line-height: 1.6\">B2B software and infrastructure that decarbonises energy, industry and logistics, sold to regulated or asset-heavy buyers in Europe and North America.<\u002Ftextarea>\n<\u002Flabel>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px\">\n<sc-for list=\"{{mandate}}\" as=\"m\" hint-placeholder-count=\"5\">\n<div style=\"display: flex; flex-direction: column; gap: 6px\"><span class=\"lbl\" style=\"font-weight: 500\">{{m.label}}<\u002Fspan><div style=\"display: flex; flex-wrap: wrap; gap: 6px\"><sc-for list=\"{{m.chips}}\" as=\"c\" hint-placeholder-count=\"3\"><span class=\"pill\">{{c}}<\u002Fspan><\u002Fsc-for><\u002Fdiv><\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n<section class=\"card\">\n<div class=\"ch\"><h2>How companies are scored<\u002Fh2><span class=\"lbl\">Weights total 100%<\u002Fspan><\u002Fdiv>\n<sc-for list=\"{{rubric}}\" as=\"r\" hint-placeholder-count=\"5\">\n<div class=\"li\" style=\"display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center\">\n<span style=\"flex: 1 1 140px; font-weight: 600\">{{r.name}}<\u002Fspan>\n<span class=\"lbl\" style=\"flex: 3 1 300px\">{{r.anchor}}<\u002Fspan>\n<span class=\"bar\" style=\"flex: 1 1 100px\"><span style=\"display: block; height: 100%; width: {{r.pct}}%; background: var(--brand)\"><\u002Fspan><\u002Fspan>\n<span style=\"width: 44px; text-align: right; font-weight: 600\">{{r.weight}}<\u002Fspan>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fsection>\n<p class=\"lbl\" style=\"margin: 0\">Which diligence domains run at each level is set in <a href=\"#\" sc-camel-on-click=\"{{goSettings}}\">Settings<\u002Fa>. AI models, spending limits and source settings are managed by your admin in the <a href=\"Console.dc.html\">agent console<\u002Fa>.<\u002Fp>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- SETTINGS -->\n<sc-if value=\"{{is.settings}}\" hint-placeholder-val=\"{{false}}\">\n<div style=\"display: flex; flex-direction: column; gap: 24px; max-width: 980px\">\n<div class=\"ph\"><div><h1>Settings<\u002Fh1><p class=\"sub\">Workspace rules for private documents and diligence domains. Changes apply to new assessments and revisions. Thesis is open source under Apache-2.0 · <a href=\"#\">Third-party notices<\u002Fa><\u002Fp><\u002Fdiv><\u002Fdiv>\n<section class=\"card\">\n<div class=\"ch\"><h2>External AI processing of private documents<\u002Fh2><span class=\"pill\" style=\"--c: {{ai.dot}}\"><span class=\"dot\" style=\"background: {{ai.dot}}\"><\u002Fspan>{{ai.label}}<\u002Fspan><\u002Fdiv>\n<div class=\"cb\" style=\"display: flex; flex-direction: column; gap: 12px\">\n<span style=\"font-size: 14px; max-width: 760px\">Off by default. Uploaded documents stay on this server. AI analysis of private documents runs only on a local model you host, or on OpenAI if a workspace owner or admin allows specific kinds of data below. The server checks this before every request.<\u002Fspan>\n<div class=\"kv\" style=\"display: grid; grid-template-columns: 170px 1fr; gap: 6px 16px; font-size: 13px\">\n<span class=\"mute\">Route for private data<\u002Fspan><span>{{ai.route}}<\u002Fspan>\n<span class=\"mute\">Local model<\u002Fspan><span>{{ai.local}}<\u002Fspan>\n<span class=\"mute\">External processing<\u002Fspan><span>{{ai.external}}<\u002Fspan>\n<span class=\"mute\">Data that may be sent<\u002Fspan><span>{{ai.categories}}<\u002Fspan>\n<\u002Fdiv>\n<sc-if value=\"{{ai.dialog}}\" hint-placeholder-val=\"{{false}}\">\n<div class=\"callout\" style=\"display: flex; flex-direction: column; gap: 10px\">\n<strong style=\"font-weight: 600\">Allow OpenAI to process private documents?<\u002Fstrong>\n<span class=\"mute\" style=\"font-size: 13px\">Only the kinds of data you tick will be sent, only for the listed purposes, until the expiry date. Every transmission is logged without its content.<\u002Fspan>\n<div style=\"display: flex; flex-wrap: wrap; gap: 6px\"><sc-for list=\"{{ai.options}}\" as=\"o\" hint-placeholder-count=\"6\"><button class=\"chip\" style=\"cursor: pointer; {{o.style}}\" sc-camel-on-click=\"{{o.toggle}}\">{{o.label}}<\u002Fbutton><\u002Fsc-for><\u002Fdiv>\n<label class=\"lbl\" style=\"display: flex; flex-direction: column; gap: 6px; font-weight: 500; max-width: 360px\">Type the workspace name to confirm<input class=\"input\" placeholder=\"Default workspace\" value=\"{{ai.confirmText}}\" sc-camel-on-input=\"{{ai.setConfirm}}\"><\u002Flabel>\n<div style=\"display: flex; gap: 8px\"><button class=\"btn btn-primary\" sc-camel-on-click=\"{{ai.confirm}}\">Allow selected data · expires in 365 days<\u002Fbutton><button class=\"btn\" sc-camel-on-click=\"{{ai.cancel}}\">Cancel<\u002Fbutton><\u002Fdiv>\n<span class=\"lbl\">You confirmed your password 2 minutes ago (step-up required for this change).<\u002Fspan>\n<\u002Fdiv>\n<\u002Fsc-if>\n<div style=\"display: flex; flex-wrap: wrap; gap: 10px\"><sc-if value=\"{{ai.canEnable}}\" hint-placeholder-val=\"{{true}}\"><button class=\"btn\" sc-camel-on-click=\"{{ai.open}}\">Allow external processing…<\u002Fbutton><\u002Fsc-if><sc-if value=\"{{ai.canRevoke}}\" hint-placeholder-val=\"{{false}}\"><button class=\"btn\" sc-camel-on-click=\"{{ai.revoke}}\">Turn off external processing<\u002Fbutton><\u002Fsc-if><button class=\"btn btn-ghost\">View transmission log<\u002Fbutton><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n<section class=\"card\">\n<div class=\"ch\"><h2>Diligence domains<\u002Fh2><span class=\"lbl\">Required domains must pass their evidence check before a recommendation is possible<\u002Fspan><\u002Fdiv>\n<div class=\"scroll\"><div style=\"min-width: 720px\">\n<div class=\"thd\" style=\"grid-template-columns: 2fr 0.8fr 1.2fr 1.6fr\"><span>Domain<\u002Fspan><span>On<\u002Fspan><span>Required<\u002Fspan><span>Runs at<\u002Fspan><\u002Fdiv>\n<sc-for list=\"{{domainCfg}}\" as=\"d\" hint-placeholder-count=\"12\">\n<div class=\"tr\" style=\"grid-template-columns: 2fr 0.8fr 1.2fr 1.6fr; cursor: default\">\n<span style=\"font-weight: 500\">{{d.name}}<\u002Fspan>\n<span><button class=\"chip\" style=\"cursor: pointer\" sc-camel-on-click=\"{{d.toggle}}\" aria-pressed=\"{{d.on}}\">{{d.onLabel}}<\u002Fbutton><\u002Fspan>\n<span class=\"mute\">{{d.req}}<\u002Fspan>\n<span style=\"display: flex; gap: 4px\"><sc-for list=\"{{d.levels}}\" as=\"l\" hint-placeholder-count=\"3\"><span class=\"chip\" style=\"{{l.style}}\">L{{l.n}}<\u002Fspan><\u002Fsc-for><\u002Fspan>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv><\u002Fdiv>\n<div class=\"lbl\" style=\"padding: 10px 18px; border-top: 1px solid var(--border)\">Stage, industry and region overrides (for example, legal becomes required for fintech) are applied on top of these defaults and saved with each assessment.<\u002Fdiv>\n<\u002Fsection>\n<section class=\"card\">\n<div class=\"ch\"><h2>Data-room retention<\u002Fh2><span class=\"lbl\">Maximum 90 days; can only be shortened<\u002Fspan><\u002Fdiv>\n<div class=\"cb\" style=\"display: flex; flex-direction: column; gap: 10px\"><span>Delete data-room files, extracted text, OCR images, tables, embeddings and exports <strong>90 days<\u002Fstrong> after an assessment closes. Reopening an assessment does not restart the clock.<\u002Fspan>\n<span class=\"lbl\">Legal holds: none active. Backups expire within 30 days of deletion; full erasure date is shown on each deletion certificate.<\u002Fspan>\n<div style=\"display: flex; gap: 8px\"><button class=\"btn\">Shorten…<\u002Fbutton><button class=\"btn btn-ghost\">Place legal hold…<\u002Fbutton><\u002Fdiv><\u002Fdiv>\n<\u002Fsection>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fmain>\n\n<sc-if value=\"{{decideOpen}}\" hint-placeholder-val=\"{{false}}\">\n<button class=\"scrim\" sc-camel-on-click=\"{{closeDecide}}\" aria-label=\"Close decision panel\"><\u002Fbutton>\n<aside class=\"drawer\" role=\"dialog\" aria-label=\"Decide on Lattice Grid\">\n<div style=\"display: flex; align-items: center; gap: 12px; padding: 18px 20px; border-bottom: 1px solid var(--border)\">\n<span class=\"logo\" style=\"background: var(--brand-soft); color: var(--brand-text); border-color: transparent\">LG<\u002Fspan>\n<span style=\"flex: 1; display: flex; flex-direction: column\"><span class=\"disp\" style=\"font-size: 19px\">Decide on Lattice Grid<\u002Fspan><span class=\"lbl\">Level {{co.level}} · revision {{co.revision}} · applies to this version only<\u002Fspan><\u002Fspan>\n<button class=\"iconbtn\" sc-camel-on-click=\"{{closeDecide}}\" aria-label=\"Close\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M6 6l12 12M18 6L6 18\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n<\u002Fdiv>\n<div style=\"flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 18px\">\n<span class=\"pill\" style=\"--c: {{co.recDot}}; align-self: flex-start\"><span class=\"dot\" style=\"background: {{co.recDot}}\"><\u002Fspan>{{co.rec}}<\u002Fspan>\n<span style=\"font-size: 15px; line-height: 1.6\">{{co.headline}}<\u002Fspan>\n<div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px\">\n<div class=\"card\" style=\"padding: 12px 14px; box-shadow: none\"><div class=\"lbl\">Evidence coverage<\u002Fdiv><div style=\"font-weight: 600\">{{lg.coverage}}<\u002Fdiv><\u002Fdiv>\n<div class=\"card\" style=\"padding: 12px 14px; box-shadow: none\"><div class=\"lbl\">Claim confidence<\u002Fdiv><div style=\"font-weight: 600\">{{lg.confidence}}<\u002Fdiv><\u002Fdiv>\n<div class=\"card\" style=\"padding: 12px 14px; box-shadow: none\"><div class=\"lbl\">Attractiveness<\u002Fdiv><div style=\"font-weight: 600\">{{lg.score}}<\u002Fdiv><\u002Fdiv>\n<div class=\"card\" style=\"padding: 12px 14px; box-shadow: none\"><div class=\"lbl\">Open risks<\u002Fdiv><div style=\"font-weight: 600\">{{lg.risks}}<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<sc-if value=\"{{lg.reqOpen}}\" hint-placeholder-val=\"{{false}}\">\n<div class=\"callout\" style=\"display: flex; flex-direction: column; gap: 8px\">\n<strong style=\"font-weight: 600\">What do you need from the company?<\u002Fstrong>\n<label class=\"lbl\" style=\"display: flex; flex-direction: column; gap: 6px; font-weight: 500\">One item per line (required)<textarea class=\"input\" style=\"min-height: 80px; padding: 10px; resize: vertical\">Signed IP assignment from the CTO covering pre-incorporation work\nWhich ARR definition the deck uses, with the calculation<\u002Ftextarea><\u002Flabel>\n<span class=\"lbl\">Each line becomes a draft request on the Requests tab. The assessment moves to “Waiting for information”.<\u002Fspan>\n<div><button class=\"btn btn-primary\" sc-camel-on-click=\"{{lg.sendRequest}}\">Send request<\u002Fbutton><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n<span class=\"lbl\">One partner decides. Your decision is recorded against this exact report version and never changes afterwards.<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 8px; padding: 14px 20px; border-top: 1px solid var(--border); background: var(--surface-2)\">\n<button class=\"btn btn-primary\" sc-camel-on-click=\"{{lg.approve}}\">Advance<\u002Fbutton>\n<button class=\"btn\" sc-camel-on-click=\"{{lg.research}}\">Request information<\u002Fbutton>\n<button class=\"btn\" sc-camel-on-click=\"{{lg.reject}}\">Pass<\u002Fbutton>\n<\u002Fdiv>\n<\u002Faside>\n<\u002Fsc-if>\n\n<sc-if value=\"{{toast.show}}\" hint-placeholder-val=\"{{false}}\">\n<div class=\"toast\" role=\"status\" aria-live=\"polite\">\n<span class=\"dot\" style=\"background: {{toast.dot}}; margin-top: 6px\"><\u002Fspan>\n<span style=\"flex: 1; display: flex; flex-direction: column; gap: 2px\"><span style=\"font-weight: 600\">{{toast.title}}<\u002Fspan><span style=\"opacity: .75\">{{toast.text}}<\u002Fspan><\u002Fspan>\n<button sc-camel-on-click=\"{{toast.close}}\" aria-label=\"Dismiss\" style=\"border: 0; background: transparent; color: inherit; opacity: .7; cursor: pointer; padding: 2px; display: flex\"><svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M6 6l12 12M18 6L6 18\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{bellOpen}}\" hint-placeholder-val=\"{{false}}\">\n<div class=\"pop\" role=\"dialog\" aria-label=\"Notifications\">\n<div class=\"ch\"><h2>Notifications<\u002Fh2><button class=\"btn btn-ghost btn-sm\" sc-camel-on-click=\"{{toggleBell}}\">Close<\u002Fbutton><\u002Fdiv>\n<sc-for list=\"{{notifications}}\" as=\"n\" hint-placeholder-count=\"3\">\n<button class=\"pitem\" style=\"align-items: flex-start; padding: 12px 16px; border-top: 1px solid var(--border)\" sc-camel-on-click=\"{{n.go}}\">\n<span class=\"dot\" style=\"background: {{n.dot}}; margin-top: 7px\"><\u002Fspan>\n<span style=\"display: flex; flex-direction: column; gap: 2px\"><span style=\"font-weight: 500\">{{n.title}}<\u002Fspan><span class=\"lbl\">{{n.when}}<\u002Fspan><\u002Fspan>\n<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{paletteOpen}}\" hint-placeholder-val=\"{{false}}\">\n<div class=\"overlay\">\n<div class=\"palette\" role=\"dialog\" aria-label=\"Command palette\">\n<div style=\"display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--border)\">\n<svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"2\" aria-hidden=\"true\"><circle cx=\"11\" cy=\"11\" r=\"7\"><\u002Fcircle><path d=\"M20 20l-3.5-3.5\"><\u002Fpath><\u002Fsvg>\n<label for=\"pal\" style=\"flex: 1\"><input id=\"pal\" style=\"width: 100%; border: 0; outline: 0; background: transparent; font-size: 15px\" placeholder=\"Type a company or command\"><\u002Flabel>\n<button class=\"kbd\" style=\"cursor: pointer\" sc-camel-on-click=\"{{closePalette}}\">Esc<\u002Fbutton>\n<\u002Fdiv>\n<div class=\"sect\" style=\"padding: 12px 16px 4px\">Jump to<\u002Fdiv>\n<sc-for list=\"{{commands}}\" as=\"c\" hint-placeholder-count=\"6\">\n<button class=\"pitem\" sc-camel-on-click=\"{{c.go}}\"><span class=\"logo\" style=\"width: 26px; height: 26px; font-size: 10px; border-radius: 7px\">{{c.tag}}<\u002Fspan><span style=\"flex: 1\">{{c.label}}<\u002Fspan><span class=\"lbl\">{{c.hint}}<\u002Fspan><\u002Fbutton>\n<\u002Fsc-for>\n<a class=\"pitem\" href=\"Console.dc.html\" style=\"border-top: 1px solid var(--border)\"><span class=\"logo\" style=\"width: 26px; height: 26px; font-size: 10px; border-radius: 7px\">AC<\u002Fspan><span style=\"flex: 1\">Open agent console<\u002Fspan><span class=\"lbl\">Admins<\u002

[project]
name = "thesis-contracts"
version = "0.1.0"
description = "Typed contracts for Thesis (identity, lifecycle, ledger, budgets, DD models)"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/thesis_contracts"]
